<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>zKuvix</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        min-height: 100%; margin: 0; padding: 0;
        background-color: #090d12;
    background-image: linear-gradient(rgba(5, 8, 18, .43), rgba(5, 8, 18, .52)), url("background.jpg");
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
        color: #e5edf2;
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      #brand {
        min-height: 64px; display: flex; align-items: center; justify-content: center;
        gap: 11px; padding: 12px 18px;
        background: rgba(8, 13, 18, .72);
        border-bottom: 1px solid rgba(113, 225, 210, .16);
        box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
      }
      #brand img { width: 40px; height: 40px; border-radius: 10px; }
      #brand b { color: #f0f7f7; font-size: 15px; letter-spacing: .18em; }
      #spin {
        position: fixed; top: calc(50% + 25px); left: 50%; width: 48px; height: 48px;
        margin: -24px 0 0 -24px; border: 3px solid #243940;
        border-top-color: #12baff; border-right-color: #12baff; border-radius: 50%;
        box-shadow: 0 0 28px rgba(18, 186, 255, .22);
        animation: spin .85s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg {
        position: fixed; top: 50%; left: 18px; right: 18px; transform: translateY(-50%);
        max-width: 560px; margin: auto; padding: 24px;
        border: 1px solid #30454d; border-radius: 14px;
        background: rgba(17, 27, 34, .96); box-shadow: 0 22px 70px rgba(0, 0, 0, .4);
        text-align: center; font-size: 17px; letter-spacing: .02em; display: none;
      }
      #wrap { padding: 0; }
      #state, #out { display: none; }
      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg { display: block; color: #ffaaa2; border-color: rgba(255, 143, 139, .6); }
      body.done #msg { display: block; color: #ff32ca; border-color: rgba(255, 50, 202, .65); }
      #msg .status-label { display: block; margin-bottom: 22px; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
      #msg .status-text { display: block; font-size: 31px; font-weight: 700; letter-spacing: 0; }
      body.done #msg .status-label { color: #ff32ca; }
      body.fail #msg .status-label { color: #ff8f8b; }
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap { width: calc(100% - 36px); max-width: 760px; margin: 8vh auto 0; }
      body.log #state { display: block; margin: 0 0 12px; font-size: 22px; font-weight: 700; }
      body.log #out {
        display: block; height: calc(100vh - 150px); overflow-y: auto;
        padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere;
        background: rgba(13, 20, 27, .96); border: 1px solid #253943; border-radius: 12px;
        color: #c5d4d9; font: 12px/1.55 Consolas, monospace;
        box-shadow: 0 22px 70px rgba(0, 0, 0, .3);
      }
      .ok, .safe { color: #79d8b3; }
      .bad, .danger { color: #ff8f8b; }
      .warn { color: #f1c879; }
      code { color: #8fe6d3; }
      @media (max-width: 520px) {
        body.log #wrap { margin-top: 5vh; }
        body.log #out { height: calc(100vh - 120px); padding: 13px; }
        #msg .status-text { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="logo_zkuvix.png"
        alt=""
        width="28"
        height="28"
      /><b>Web-Host Exploit By zKuvix</b>
    </div>
    <div id="spin"></div>
    <div id="msg"><span class="status-label">ERROR</span><span class="status-text">Restart your console</span></div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=20";
    </script>
  </body>
</html>
